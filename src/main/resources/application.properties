# 通用配置（默认直连云服务器 MySQL，不依赖本地数据库 / Docker）
spring.application.name=springBootProject
server.port=1234

# 云服务器 MySQL 配置（106.15.207.57，库名 localhost）
spring.datasource.url=jdbc:mysql://106.15.207.57:3306/localhost?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=174621
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT 密钥（必须超过 64 个字符）
app.security.jwt-secret=vdfv8sv9dv8s9dv8fb9809d3fb456fd7bdfbd45f6b7sdvsv45sd67vsdfvs4d5v67sdvsdv45s6d7v

# Hikari 连接池配置
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000

# JPA 配置
# update：云库表已存在且与实体对齐时不会改动；缺失的 photos 表会自动创建
spring.jpa.hibernate.ddl-auto=update
# 云库列名为驼峰（roleId/roleName/...），用标准命名策略避免被转成下划线
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# 照片中转文件存放根目录（按 userId 分子目录）。不配置则默认 <应用目录>/photo-vault
# 注意：该目录不在静态资源映射内，只能通过 /api/photos 鉴权接口访问，保证用户间隔离
app.photo-vault-dir=

# 中转文件保留天数：PC 端下载后若未调用 /api/photos/confirm/{id} 确认删除
# （崩溃/断网等），超过此天数的残留文件会由定时任务清理。设为 0 或负数则不清理
app.photo-vault-retention-days=7

# ===== 上传大小限制（必配）=====
# 不配置时 Spring Boot 用默认值：单文件 1MB / 整个请求 10MB。
# 手机拍的照片普遍 2~10MB，会在进入 Controller 之前就被 multipart 解析阶段拦截，
# 抛 MaxUploadSizeExceededException → 返回 413，Controller 里的上限校验根本执行不到。
# 此处与 PhotoController.MAX_PHOTO_SIZE 对齐（100MB）
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
# 超限时服务端继续丢弃剩余请求体的上限；-1 表示不限制。
# 默认仅 2MB，上传大文件被拒时容易变成连接被重置而不是干净的 413 响应
server.tomcat.max-swallow-size=-1
