# 通用配置（默认直连云服务器 MySQL，不依赖本地数据库 / Docker）
spring.application.name=springBootProject
server.port=1234

# 云服务器 MySQL 配置（106.15.207.57，库名 localhost）
spring.datasource.url=jdbc:mysql://106.15.207.57:3306/localhost?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=174621
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT 密钥（必须超过 64 个字符）
app.security.jwt-secret=vdfv8sv9dv8s9dv8fb9809d3fb456fd7bdfbd45f6b7sdvsv45sd67vsdfvs4d5v67sdvsdv45s6d7v

# Hikari 连接池配置
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000

# JPA 配置
# update：云库表已存在且与实体对齐时不会改动；缺失的 photos 表会自动创建
spring.jpa.hibernate.ddl-auto=update
# 云库列名为驼峰（roleId/roleName/...），用标准命名策略避免被转成下划线
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# 照片中转文件存放根目录（按 userId 分子目录）。不配置则默认 <应用目录>/photo-vault
# 注意：该目录不在静态资源映射内，只能通过 /api/photos 鉴权接口访问，保证用户间隔离
app.photo-vault-dir=
