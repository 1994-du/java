# 本地 Docker MySQL 配置
spring.datasource.url=jdbc:mysql://localhost:3306/java_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT 本地密钥（必须超过 64 个字符）
app.security.jwt-secret=this-is-a-local-secret-key-for-jwt-token-generation-must-be-over-64-chars-1234567890